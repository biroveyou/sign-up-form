<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="stylesheet" href="./styles.css"/>
</head>
<body>
    <div class="main-image">
        <img src="./images/painted_art.jpg">
        <p>Photo by <a href="https://unsplash.com/@metropolitanmuseum?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">The Metropolitan Museum of Art</a> on <a href="https://unsplash.com/photos/pine-tree-on-rocky-cliff-XsRdTBppTG8?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a></p>
    </div>
    <div class="form-structure">
        <div class="logo">
            <img src="./logo/odin-lined.png">
            <p>ODIN</p>
        </div>
        <div class="text">
            <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <span class="italic">now</span> to get started.</p>
            <p>You <span class="italic">know</span> you want to.</p>
        </div>
        <div class="sign-up-form">
            <form action="" method="post">
                <div class="form-row name">
                    <p>
                        <label for="fname">First Name</label>
                        <input id="fname" type="text">
                    </p>
                    <p>
                        <label for="lname">Last Name</label>
                        <input id="lname" type="text">
                    </p>
                </div>
                <div class="form-row personal-info">
                    <p>
                        <label for="email">Email Address</label>
                        <input id="email" type="email" placeholder="sample@gmail.com">
                    </p>
                    <p>
                        <label for="phone">Phone number</label>
                        <input id="phone" type="tel" placeholder="++1-283 483 822">
                    </p>
                </div>
                <div class="form-row password">
                    <p>
                        <label for="password">Password</label>
                        <input id="password" type="password">
                    </p>
                    <p>
                        <label for="confirm-password">Confirm Password</label>
                        <input id="confirm-password" type="password">
                    </p>
                </div>
                <div class="submit-btn">
                    <button type="submit">Create Account</button>
                    <p>Already have an account? <a href="">Log in</a></p>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
